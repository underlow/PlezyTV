name: PlezyTV upstream sync
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: plezytv-upstream-sync
  cancel-in-progress: false
env:
  FLUTTER_VERSION: '3.47.1'
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      - name: Merge upstream into dedicated branch
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B upstream-sync origin/main
          git remote add upstream https://github.com/edde746/plezy.git
          git fetch upstream main
          if git merge --no-edit upstream/main > "$RUNNER_TEMP/upstream-merge.log" 2>&1; then
            echo 'clean=true' >> "$GITHUB_OUTPUT"
          else
            echo 'clean=false' >> "$GITHUB_OUTPUT"
            {
              echo 'Upstream merge failed. Conflicted paths:'
              git diff --name-only --diff-filter=U
              echo
              cat "$RUNNER_TEMP/upstream-merge.log"
            } > "$RUNNER_TEMP/upstream-details.txt"
            git merge --abort || true
          fi
      - name: Check workflow push authorization
        id: push_gate
        if: steps.merge.outputs.clean == 'true'
        env:
          HAS_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
        run: |
          # Inspect all incoming commits, including changes later reverted in history.
          git log --format= --name-only origin/main..HEAD -- .github/workflows/ | sort -u | sed '/^$/d' > "$RUNNER_TEMP/upstream-workflows.txt"
          if [[ "$HAS_SYNC_TOKEN" != true && -s "$RUNNER_TEMP/upstream-workflows.txt" ]]; then
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            {
              echo 'UPSTREAM_SYNC_TOKEN is required: incoming commits modify .github/workflows/.'
              echo 'GITHUB_TOKEN cannot push these commits. No branch push or PR update was attempted.'
              echo 'Add a fine-grained PAT with repository Contents, Pull requests, Issues and Workflows write permissions as UPSTREAM_SYNC_TOKEN, then rerun.'
              echo
              cat "$RUNNER_TEMP/upstream-workflows.txt"
            } > "$RUNNER_TEMP/upstream-details.txt"
          else
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        if: steps.merge.outputs.clean == 'true' && steps.push_gate.outputs.allowed == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.merge.outputs.clean == 'true' && steps.push_gate.outputs.allowed == 'true'
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Validate merged tree
        id: checks
        if: steps.merge.outputs.clean == 'true' && steps.push_gate.outputs.allowed == 'true'
        continue-on-error: true
        run: |
          set +e
          failed=0
          for command in \
            'flutter pub get --enforce-lockfile' \
            '(cd packages/wakelock_plus && flutter pub get --enforce-lockfile --no-example)' \
            'dart run scripts/checks/check_analyzer.dart' \
            'scripts/format_native.sh --check' \
            'flutter test' \
            'flutter build apk --debug'; do
            echo "::group::$command"
            bash -o pipefail -c "$command" 2>&1 | tee -a "$RUNNER_TEMP/upstream-checks.log"
            result=${PIPESTATUS[0]}
            echo "Exit status: $result" | tee -a "$RUNNER_TEMP/upstream-checks.log"
            echo '::endgroup::'
            if [[ "$result" != 0 ]]; then failed=1; fi
          done
          exit "$failed"
      - name: Push branch and open or update PR
        if: always() && steps.merge.outputs.clean == 'true' && steps.push_gate.outputs.allowed == 'true'
        env:
          CHECK_RESULT: ${{ steps.checks.outcome }}
        run: |
          if git diff --quiet origin/main HEAD; then
            echo 'No upstream changes to propose.'
            exit 0
          fi
          git push --force-with-lease origin HEAD:refs/heads/upstream-sync
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf 'Merge upstream/main into PlezyTV.\n\nValidation: %s. [Workflow logs](%s).\n' "$CHECK_RESULT" "$run_url" > "$RUNNER_TEMP/upstream-pr.md"
          if ! git diff --quiet origin/main HEAD -- lib/screens/main_screen.dart lib/navigation/navigation_tabs.dart lib/navigation/main_screen_scope.dart; then
            printf '\nWarning: upstream changes TV shell dependencies. Review the repeated MainScreen duties in docs/plezytv/tv-ui.md against lib/plezytv/tv_ui/shell/.\n' >> "$RUNNER_TEMP/upstream-pr.md"
          fi
          if ! git diff --quiet origin/main HEAD -- \
            lib/screens/libraries/tabs/library_browse_tab.dart \
            lib/screens/libraries/tabs/base_library_tab.dart \
            lib/screens/libraries/libraries_screen.dart \
            lib/screens/libraries/library_browse_grouping.dart \
            lib/screens/libraries/library_alpha_bar_strategy.dart \
            lib/services/library_query_translator.dart \
            lib/widgets/library_management_sheet.dart; then
            printf '\nWarning: upstream changes S16 library dependencies. Review the copied query glue and library actions in lib/plezytv/tv_ui/library/ against design D1 and docs/plezytv/tv-ui.md.\n' >> "$RUNNER_TEMP/upstream-pr.md"
          fi
          if ! git diff --quiet origin/main HEAD -- \
            lib/screens/media_detail_screen.dart \
            lib/screens/media_detail/action_buttons.dart \
            lib/media/episode_collection.dart \
            lib/utils/plex_season_display.dart \
            lib/utils/media_navigation_helper.dart \
            lib/widgets/media_context_menu.dart \
            lib/utils/download_utils.dart; then
            printf '\nWarning: upstream changes S7 show dependencies. Review show orchestration and public action parity in lib/plezytv/tv_ui/show/ against design D2 and docs/plezytv/tv-ui.md.\n' >> "$RUNNER_TEMP/upstream-pr.md"
          fi
          if ! git diff --quiet origin/main HEAD -- \
            lib/screens/media_detail_screen.dart \
            lib/screens/media_detail/action_buttons.dart \
            lib/utils/media_navigation_helper.dart; then
            printf '\nWarning: upstream changes S8 movie dependencies. Review copied action visibility, watchlist/download handlers and missing-item handling in lib/plezytv/tv_ui/movie/ against docs/plezytv/tv-ui.md.\n' >> "$RUNNER_TEMP/upstream-pr.md"
          fi
          if ! git diff --quiet origin/main HEAD -- \
            lib/widgets/video_controls/desktop_video_controls.dart \
            lib/widgets/video_controls/video_controls.dart \
            lib/widgets/video_controls/parts/markers.dart \
            lib/widgets/video_controls/parts/navigation.dart \
            lib/widgets/video_controls/sheets/video_settings_sheet.dart \
            lib/widgets/video_controls/sheets/track_sheet.dart \
            lib/widgets/video_controls/widgets/skip_marker_button.dart \
            lib/widgets/video_controls/widgets/sync_offset_control.dart \
            lib/widgets/video_controls/widgets/sleep_timer_content.dart \
            lib/media/stepped_seek.dart \
            lib/screens/video_player/widgets/player_prompt_overlays.dart \
            lib/screens/video_player/parts/build.dart; then
            printf '\nWarning: upstream changes S9 player dependencies. Review the copied seek handling, key-method replacements, skip-button offsets and side-panel item rules in lib/plezytv/tv_ui/player/ against design D6-D8 and docs/plezytv/tv-ui.md.\n' >> "$RUNNER_TEMP/upstream-pr.md"
          fi
          number=$(gh pr list --head upstream-sync --base main --state open --json number --jq '.[0].number // empty')
          title='Sync upstream Plezy'
          if [[ "$CHECK_RESULT" != success ]]; then title='Sync upstream Plezy (checks failing)'; fi
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/upstream-pr.md"
          else
            gh pr create --head upstream-sync --base main --title "$title" --body-file "$RUNNER_TEMP/upstream-pr.md"
          fi
      - name: Report conflict or validation failure
        if: always()
        env:
          PUSH_ALLOWED: ${{ steps.push_gate.outputs.allowed }}
          MERGE_CLEAN: ${{ steps.merge.outputs.clean }}
          CHECK_RESULT: ${{ steps.checks.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          succeeded=false
          if [[ "$PUSH_ALLOWED" == true && "$MERGE_CLEAN" == true && "$CHECK_RESULT" == success && "$JOB_STATUS" == success ]]; then
            succeeded=true
          fi
          {
            if [[ "$succeeded" == true ]]; then
              echo 'Upstream sync checks passed.'
            else
              printf 'Upstream sync needs attention. Merge clean: %s; checks: %s; job: %s.\n\n' "$MERGE_CLEAN" "$CHECK_RESULT" "$JOB_STATUS"
            fi
            printf 'Logs: %s/%s/actions/runs/%s\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            if [[ -f "$RUNNER_TEMP/upstream-details.txt" ]]; then cat "$RUNNER_TEMP/upstream-details.txt"; fi
            if [[ -f "$RUNNER_TEMP/upstream-checks.log" ]]; then
              echo 'Last validation output:'
              tail -c 20000 "$RUNNER_TEMP/upstream-checks.log"
            fi
          } > "$RUNNER_TEMP/upstream-issue.md"
          has_issues=$(gh api "repos/$GH_REPO" -q .has_issues)
          if [[ "$has_issues" != true ]]; then
            echo 'Issues are disabled; reporting upstream sync status here.' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/upstream-issue.md" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$succeeded" == true ]]; then exit 0; fi
            exit 1
          fi
          gh label create upstream-sync --description 'Automated upstream merge status' --color D93F0B --force
          number=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number // empty')
          if [[ "$succeeded" == true ]]; then
            if [[ -n "$number" ]]; then gh issue close "$number" --comment "Upstream checks now pass: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; fi
            exit 0
          fi
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/upstream-issue.md"
          else
            gh issue create --title 'Upstream sync needs attention' --label upstream-sync --body-file "$RUNNER_TEMP/upstream-issue.md"
          fi
          exit 1
